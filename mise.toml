# Rust is pinned once, in rust-toolchain.toml, for tools/pobr-data-adapter.
[settings]
idiomatic_version_file_enable_tools = ["rust"]

[tools]
# Refresh explicitly with `mise lock --bump`; replay uses the committed lock.
python = "latest"
uv = "latest"

[env]
UV_PYTHON = "python"

# A C compiler for dependencies published only as source (mwparserfromhell).
# macOS uses the Xcode command line tools; GitHub's Ubuntu runners ship one.
[bootstrap.packages]
"apt:build-essential" = { os = "linux" }

[tasks.setup]
description = "Sync the locked runtime and development environment into .venv"
run = "uv sync --locked"

[tasks."schema:check"]
description = "Verify the prepared schema input without activating it"
run = "shasum -a 256 -c schema/SHA256SUMS"

[tasks."schema:candidate"]
description = "Generate a validated native schema candidate; --out must be inside .cache"
run = "uv run --locked --offline python -m RePoE.native.schema_candidate"

[tasks."models:generate"]
description = "Regenerate JSON-schema models explicitly (optional schema paths)"
run = "bash datamodel-codegen.sh"

[tasks.test]
description = "Run the exporter regression tests offline"
run = "uv run --locked --offline python -m unittest discover -s tests -t . -v"

[tasks.lint]
description = "Check Python lint rules and formatting"
run = ["uv run --locked --offline ruff check .", "uv run --locked --offline ruff format --check ."]

[tasks.check]
description = "Validate the lock, fixed schema, code and offline regression tests"
depends = ["schema:check", "lint", "test"]
run = ["uv lock --check --offline", "uv run --locked --offline repoe --help"]

[tasks."adapter:check"]
description = "Format, lint and test tools/pobr-data-adapter with the pinned toolchain and Cargo.lock; production code may depend on pobr-data only"
dir = "tools/pobr-data-adapter"
run = [
  "cargo fmt --check",
  "cargo clippy --locked --all-targets -- -D warnings",
  "cargo test --locked",
  "python3 -B tests/check_engine_deps.py",
]

[tasks."adapter:keystones"]
description = "Rebuild the published game package's keystone rules from its passive tree and compare bytes (default: the reference package of the highest release/<patch>[-<n>]/)"
run = "python3 -B tools/pobr-data-adapter/tests/check_package_keystones.py"

[tasks.adapter]
description = "Run pobr-data-adapter (--ordinary-facts, --tree, --emit-special-derived); see tools/pobr-data-adapter"
dir = "{{cwd}}"
run = "cargo run --locked --quiet --manifest-path {{config_root}}/tools/pobr-data-adapter/Cargo.toml --"

[tasks."facts:candidate"]
description = "Export native facts; explicit source-lock/source/raw/out and optional core-skills-a0, gems-constraints-a1 or items-actors-bc profile"
run = "uv run --locked --offline python -B -m RePoE.native.facts"

[tasks."facts:validate"]
description = "Verify a facts candidate against pinned raw inputs and all graph instance fields"
run = "uv run --locked --offline python -B -m RePoE.native.validate"

[tasks."descriptions:candidate"]
description = "Export selected byte-pinned CSD branches offline without choosing translations or executing handlers"
run = "uv run --locked --offline python -B -m RePoE.native.descriptions"

[tasks."tables:candidate"]
description = "Export explicitly pinned supplemental DAT tables through the existing native reader"
run = "uv run --locked --offline python -B -m RePoE.native.tables"

[tasks."release:ci-configs"]
description = "List current and non-retired declarations for full-package CI rebuilds; fails on invalid release/ci.json"
run = "python -B -m RePoE.release.ci_declarations"

[tasks."release:build"]
description = "Rebuild the game part from pinned inputs (Git blobs or Release assets) and classify every member against the reference package (--config release/<patch>[-<n>], default: highest; --fetch, --check)"
run = "cargo build --locked --release --quiet --manifest-path tools/pobr-data-adapter/Cargo.toml && python -B -m RePoE.release.build"

[tasks."release:publish"]
description = "Stage a release:build package as the game/<patch>-<n> GitHub Release assets and print the plan; --yes tags, pushes and creates the Release (--config release/<patch>[-<n>], --dry-run, --reuse)"
run = "cargo build --locked --release --quiet --manifest-path tools/pobr-data-adapter/Cargo.toml && python -B -m RePoE.release.publish"

[tasks."release:inputs"]
description = "Package a patch's extracted inputs (--patch, --package NAME=DIR) as deterministic zips for the inputs/<patch>-<n> GitHub Release and print their inputs.lock.json entries; --yes tags, pushes and creates the Release"
run = "python -B -m RePoE.release.inputs"

[tasks."release:policy-draft"]
description = "Draft unreviewed passive-tree policy entries from a forward build receipt's coverage; refuses existing outputs"
run = "python -B -m RePoE.release.policy_draft"

[tasks."policy:rebind"]
description = "Create new policies and domains.json from an old declaration and a release:inputs stage; refuses existing outputs"
run = "python -B -m RePoE.release.policy_rebinding"

[tasks."client:source"]
description = "Acquire one fixed source or import archived ranges with explicit inputs"
run = "python -B -m RePoE.client.sources"

[tasks."client:export-lock"]
description = "Derive an export lock from an explicitly byte-pinned acquisition lock; optional repeated --source selects sources"
run = "python -B -m RePoE.client.export_lock"

[tasks."client:draft"]
description = "Collect a location-only selection as an unreviewed acquisition draft"
run = "python -B -m RePoE.client.source_draft"

[tasks."client:locate"]
description = "Locate explicit paths in a fixed index; --diagnostic retains missing paths without a selection"
run = "python -B -m RePoE.client.index"

[tasks."source:rebind"]
description = "Create or verify a pinned offline draft source envelope"
run = "python -B -m RePoE.client.source_rebinding"

[tasks."client:capture"]
description = "Verify an owner-run capture-sc.ps1 client capture and extract explicit paths into raw files, a capture receipt and a source lock under .cache/"
run = "python -B -m RePoE.client.capture"

[tasks."client:version"]
description = "Observe the official PoE2 TCP patch endpoint; optional fresh raw observation output"
run = "python -B -m RePoE.client.version"

[tasks."facts:player"]
description = "Export pinned starting/keyword/metadata context; no actor binding or formulas"
run = "uv run --locked --offline python -B -m RePoE.native.player"
