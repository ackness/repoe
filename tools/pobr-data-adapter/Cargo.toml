[package]
name = "pobr-data-adapter"
version = "0.1.0"
edition = "2024"
publish = false
description = "Adapts pinned RePoE facts and PoBR domain policies into PoBR's runtime JSON"

# A standalone workspace: RePoE is otherwise a Python project.
[workspace]

# PoBR crates come from one immutable contract tag of ackness/pobr,
# `contract/<n>.<m>` with n = pobr_data::CONTRACT_VERSION. Every PoBR entry,
# normal and dev, names the same tag: mixed tags compile two copies of
# pobr-data whose types do not match. Cargo.lock pins the resolved commit; bump
# the tag deliberately when PoBR's data contract changes, never move it.
# Production code depends on pobr-data only; the engine crates are for tests
# (`mise run adapter:check` enforces both rules).
[dependencies]
pobr-data = { git = "https://github.com/ackness/pobr", tag = "contract/1.0" }
serde = { version = "1", features = ["derive"] }
# Raw PSG coordinates must round-trip exactly; the default parser can shift one ULP.
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = { version = "0.11", default-features = false }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
# Safe directory-relative syscalls keep guarded output writes on verified handles.
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
pobr-core = { git = "https://github.com/ackness/pobr", tag = "contract/1.0" }
pobr-gamedata = { git = "https://github.com/ackness/pobr", tag = "contract/1.0" }
pobr-item = { git = "https://github.com/ackness/pobr", tag = "contract/1.0" }
pobr-tree = { git = "https://github.com/ackness/pobr", tag = "contract/1.0" }

# Same settings as PoBR: line tables for panic locations, no incremental object
# graphs, and optimized dependencies so JSON-heavy tests stay fast.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
opt-level = 3

# TODO(before merge): remove this patch and bump every PoBR entry above to
# `tag = "contract/1.1"` once ackness/pobr tags it. Local development of game
# 0.5.5.5-2 builds the adapter against the unpublished contract revision in a
# sibling PoBR worktree (branch feat/data-batch-contract).
[patch."https://github.com/ackness/pobr"]
pobr-data = { path = "../../../pobr-w5/crates/pobr-data" }
pobr-core = { path = "../../../pobr-w5/crates/pobr-core" }
pobr-gamedata = { path = "../../../pobr-w5/crates/pobr-gamedata" }
pobr-item = { path = "../../../pobr-w5/crates/pobr-item" }
pobr-tree = { path = "../../../pobr-w5/crates/pobr-tree" }
