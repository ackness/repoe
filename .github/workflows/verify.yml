name: Verify exporters

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5
        with:
          version: '2026.10.23'
      - name: Install declared host packages
        run: mise bootstrap --only packages
      - name: Install locked dependencies
        run: mise run setup
      - name: Check schema, lock, code and offline tests
        run: mise run check
