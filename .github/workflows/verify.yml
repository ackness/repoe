name: Verify exporters

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Rust is only for tools/pobr-data-adapter, checked by the job below.
      MISE_DISABLE_TOOLS: rust
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5
        with:
          version: '2026.10.23'
      - name: Install declared host packages
        run: mise bootstrap --only packages
      - name: Install locked dependencies
        run: mise run setup
      - name: Check schema, lock, code and offline tests
        run: mise run check

  adapter:
    name: pobr-data-adapter
    runs-on: ubuntu-latest
    env:
      # rustup on the runner reads the root rust-toolchain.toml.
      MISE_DISABLE_TOOLS: rust
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5
        with:
          version: '2026.10.23'
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: tools/pobr-data-adapter
          cache-bin: 'false'
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Format, lint and test the adapter
        run: mise run adapter:check
      - name: Keystone rules match the published game package
        run: mise run adapter:keystones

  release:
    name: release:build reproduces the published game package
    runs-on: ubuntu-latest
    env:
      MISE_DISABLE_TOOLS: rust
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5
        with:
          version: '2026.10.23'
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: tools/pobr-data-adapter
          cache-bin: 'false'
          save-if: ${{ github.event_name != 'pull_request' }}
      # Pinned handoff commits are fetched from origin by SHA (Git only, no game CDN).
      # --check fails unless each zip is byte-identical to its lock's reference package.
      - name: Rebuild every declared patch's game package from pinned inputs
        run: |
          for config in release/*/; do
            mise run release:build -- --config "${config%/}" --fetch --check
          done
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: release-receipt
          path: |
            .cache/release/*/receipt.json
            .cache/release/*/package.json
            .cache/release/*/SHA256SUMS
          if-no-files-found: ignore
